[pytest]
markers =
    openai: mark test as using OpenAI embedder (1536 dimensions)
    sentence: mark test as using SentenceTransformers embedder (384 dimensions, default)
    no_embeddings: mark test as not requiring embeddings/vector operations

log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

addopts = --log-cli-level=DEBUG -o log_cli=true -o log_level=DEBUG -v

# Configure logging for specific modules
loggers =
    vector_rag = DEBUG
    vector_rag.db = DEBUG
    vector_rag.db.db_file_handler = DEBUG
    tests = DEBUG
    sqlalchemy = WARNING
