version: '3'

dotenv: ['.env']

tasks:
  install-poetry:
    desc: "Install Poetry if not already installed"
    cmds:
      - |
        if ! command -v poetry &> /dev/null; then
          echo "Installing Poetry..."
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="/Users/cmathias/.local/bin:$PATH"
          source ~/.zshrc
        else
          echo "Poetry is already installed"
        fi

  install:
    desc: "Install package and dependencies using Poetry"
    deps: [install-poetry]
    cmds:
      - poetry install --with sentence-transformers

  setup-dev:
    desc: "Set up the local dev environment with Poetry"
    deps: [install-poetry]
    cmds:
      - echo "Setting up dev environment..."
      - |
        if command -v poetry &> /dev/null; then
          POETRY_CMD="poetry"
        else
          POETRY_CMD="~/.local/bin/poetry"
        fi
        $POETRY_CMD env use python3.12
        $POETRY_CMD install --with dev
      - echo "✅ Development environment setup complete"
      
  verify-deps:
    desc: "Verify that dependencies are installed correctly"
    cmds:
      - poetry check
      - poetry install --dry-run
      - echo "All dependencies verified successfully! ✅"

  update-deps:
    desc: "Update dependencies to their latest versions"
    cmds:
      - poetry update
      - poetry lock
      - echo "Dependencies updated successfully! ✅"

  export-reqs:
    desc: "Export requirements files from Poetry"
    cmds:
      - poetry export -f requirements.txt --output requirements.txt --without-hashes
      - poetry export -f requirements.txt --output requirements-dev.txt --with dev --without-hashes
    generates:
      - requirements.txt
      - requirements-dev.txt

  test:all:
    desc: "Run Python tests"
    cmds:
      - poetry run pytest tests/
      - echo "✅ All tests passed"

  test:name:
    desc: "Run a specific test by name"
    cmds:
      - poetry run pytest tests/ -k "{{.CLI_ARGS}}"
      - echo "✅ Test completed"

  test:integration:
    desc: "Run integration tests"
    cmds:
      - sleep 5  # Give DB time to start
      - poetry run pytest tests/integration -v

  test:single:
    desc: "Run a single test"
    cmds:
      - poetry run pytest "{{.CLI_ARGS}}"
      - echo "✅ Test completed"

  test:coverage:
    desc: "Run Python tests with coverage report"
    cmds:
      - poetry run pytest tests/ --cov=src/vector_rag --cov-report=term-missing
      - echo "✅ Coverage report generated"

  format:
    desc: "Format Python code"
    cmds:
      - poetry run black src/ tests/
      - poetry run isort src/ tests/
      - echo "✅ Code formatting complete"

  typecheck:
    desc: "Run type checking"
    cmds:
      - poetry run mypy src/
      - echo "✅ Type checking complete"

  lint:
    desc: "Run all code quality checks"
    deps: [format, typecheck, test:all]


  documentation:create-project-markdown:
    desc: "Create Markdown for LLMs"
    cmds:
      - create-project-markdown

  db:up:
    desc: Start the database container
    cmds:
      - docker compose up -d db
      - sleep 3  # Give the DB time to initialize
      - |
        until docker compose exec db pg_isready; do
          echo "Waiting for database..."
          sleep 1
        done

  db:recreate:
    desc: Recreate database from scratch
    cmds:
      - task: db-down
      - rm -rf ./postgres_data
      - task: db-up

  db:down:
    desc: Stop the database container
    cmds:
      - docker compose down

  demo:mock:
    desc: "Run example ingestion flow with mock embedder"
    cmds:
      - python src/scripts/run_example.py examples/sample.txt mock

  demo:openai:
    desc: "Run example ingestion flow with OpenAI embedder"
    cmds:
      - python src/scripts/run_example.py examples/sample.txt openai

  psql:
    desc: "Start an interactive psql session"
    cmds:
      - PGPASSWORD=${DB_PASSWORD} psql -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USER} -d ${DB_NAME}

  db:migrate:
    desc: "Apply database migrations (including FTS support)"
    deps: [db:up]
    cmds:
      - echo "Applying database migrations..."
      - poetry run python db/scripts/apply_migrations.py
      - echo "✅ Migrations applied successfully"
